[package]
name = "sum100"
version = "0.1.0"
edition = "2024"
default-run = "sum100"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.6", features = ["derive"] }
flate2 = "1.1.10"
futures-util = "0.3.34"
rand = "0.10.2"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "query"] }
rsa = { version = "0.9.10", features = ["getrandom"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["full"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
toml = "1.1.6"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
