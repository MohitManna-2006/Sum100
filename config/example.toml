# Sum100 example configuration.
#
# Read by `sum100 scan` and `sum100 registry validate` via --config. Copy to
# config/local.toml to customize; unknown keys are rejected at startup, so a
# typo fails loudly instead of silently leaving a default in place.

[engine]
# Quotes older than this are treated as stale and never produce a signal.
# The gate is all-or-nothing across a group: one stale member skips the whole
# thing, so a wide ladder over illiquid wings is rarely evaluable at 500 ms.
max_book_age_ms = 500
# Minimum net profit, in integer cents, for a candidate to be reported.
min_net_edge_cents = 1
# Minimum annualized return on locked capital, as a ratio (0.15 = 15%).
min_annualized_return = 0.15
# Cap on contracts per leg.
max_position_size = 500

[venues.kalshi]
enabled = true
# Quantized to thousandths on the way in so fee arithmetic stays integral.
fee_multiplier = 1.0
cache_dir = ".cache/kalshi"

[venues.polymarket]
# Enabled, `scan --live` reads the Gamma catalogue at startup, registers every
# market it can represent as a complement group, and subscribes to them beside
# Kalshi. Markets finer than a one-cent tick are skipped: the book is indexed by
# whole cents and rounding one in would quote a price nobody made.
enabled = false
# The catalogue, not the order book. Discovery reads markets and their fee
# schedules from here; the feed connects to the CLOB websocket separately.
metadata_url = "https://gamma-api.polymarket.com"
cache_dir = ".cache/polymarket"

[registry]
path = "config/registry.toml"

[recorder]
enabled = true
output_dir = "data"
compress = true

[risk]
# Capital the engine starts with, and the railings around spending it.
starting_capital_cents = 1000000
max_per_event_cents = 50000
max_per_theme_cents = 100000
max_concurrent_trades = 10
# Realized loss that closes the day. Resets at UTC midnight.
max_daily_loss_cents = 100000

[executor]
# Simulate fills against the live book. Changing this is not enough to trade
# for real; the CLI also requires --live-orders, and the engine refuses a live
# client without it.
paper_mode = true
# Window for a whole multi-leg trade before its outcome is treated as unknown.
atomic_timeout_ms = 500
# Silence from a venue before it is considered unreachable.
max_idle_ms = 5000

[discovery]
enabled = true
cache_dir = ".cache/kalshi"
cache_max_age_secs = 3600
# Build the registry from venue metadata instead of config/registry.toml.
auto_discover_on_startup = false
status = "open"
# One series, e.g. "KXBTCD". Empty walks the whole venue: 12,000+ open markets
# across 10,000+ events, which is a feed-capacity decision, not just a config one.
series = ""
max_pages = 100
# An inferred relation that is wrong emits a confident arbitrage rather than
# going quiet, so real orders on a discovered group need a human first.
allow_inferred_live_orders = false
