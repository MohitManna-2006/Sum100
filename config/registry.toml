# Sum100 constraint registry.
#
# What relates to what, and when it settles. Loading is offline and
# deterministic: tickers intern to contract ids in the order they appear here,
# and the parser and book store must be built from the same list or every id
# shifts. Ticker existence is checked separately, against live venue metadata,
# by `sum100 registry validate`.
#
# This file describes the capture in data/phase3-d/, so
# `make scan-replay` has something real to solve against.

[[event]]
id = "btc-2026-09-14-17"
description = "Bitcoin price at 2026-09-14 17:00 ET, Kalshi hourly strike ladder"
resolves_at = "2026-09-14T21:00:00Z"
resolution_source = "Kalshi BTC hourly settlement"
resolution_rules_hash = 0

